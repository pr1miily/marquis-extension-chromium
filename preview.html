<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>MARQUIS - SCREENSHOT PREVIEW</title>

    <link rel="icon" type="image/png" href="img/46087a1c-4b4d-4a36-a268-1b57cb06908c.png">
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/theme_sync.js"></script>
    <style>
        #stageScroll { max-height: calc(100vh - 230px); min-height: 50vh; overflow: auto; }
        #stage { position: relative; display: inline-block; touch-action: none; }
        #stage canvas { display: block; max-width: 100%; height: auto; }
        #stage.tool-crop, #stage.tool-rect, #stage.tool-arrow, #stage.tool-pen, #stage.tool-blur { cursor: crosshair; }
        #stage.tool-text { cursor: text; }
        #draftLayer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        #textEntry { position: absolute; min-width: 160px; font-weight: 700; }

        .min-w-0 { min-width: 0; } /* lets text-truncate work inside flex rows */
        .history-item { cursor: pointer; }
        .history-item img { width: 72px; height: 48px; object-fit: cover; object-position: top; }
        .history-item.active { outline: 2px solid var(--mq-accent); outline-offset: -2px; }
</style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar shadow-sm flex-shrink-0 bg-body-tertiary border-bottom border-secondary-subtle px-3 py-2">
        <div class="container-fluid px-0 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <img src="img/46087a1c-4b4d-4a36-a268-1b57cb06908c.png" alt="" width="24" class="rounded">
                <h1 class="h6 mb-0 fw-bold text-body text-nowrap">Marquis Capture</h1>
            </div>
            <button type="button" id="closePreviewBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold">Close</button>
        </div>
    </nav>

    <main class="container-fluid flex-grow-1 p-2">
        <div class="row g-2">
            <div class="col-lg-9">
                <div class="card bg-body-tertiary border-secondary-subtle shadow-sm">
                    <div class="card-header mq-section-header flex-wrap">
                        <div class="d-flex flex-wrap align-items-center gap-2" role="toolbar" aria-label="Edit tools">
                            <div class="btn-group btn-group-sm" role="group" aria-label="Tool">
                                <button type="button" class="btn btn-outline-secondary" data-tool="crop"><i class="bi bi-crop me-1" aria-hidden="true"></i>Crop</button>
                                <button type="button" class="btn btn-outline-secondary" data-tool="rect"><i class="bi bi-square me-1" aria-hidden="true"></i>Box</button>
                                <button type="button" class="btn btn-outline-secondary" data-tool="arrow"><i class="bi bi-arrow-up-right me-1" aria-hidden="true"></i>Arrow</button>
                                <button type="button" class="btn btn-outline-secondary" data-tool="pen"><i class="bi bi-pencil me-1" aria-hidden="true"></i>Pen</button>
                                <button type="button" class="btn btn-outline-secondary" data-tool="text"><i class="bi bi-fonts me-1" aria-hidden="true"></i>Text</button>
                                <button type="button" class="btn btn-outline-secondary" data-tool="blur"><i class="bi bi-grid-3x3 me-1" aria-hidden="true"></i>Blur</button>
                            </div>
                            <input type="color" id="toolColor" class="form-control form-control-color form-control-sm" value="#ef4444" title="Color" aria-label="Color">
                            <button type="button" id="undoBtn" class="btn btn-sm btn-outline-secondary" title="Undo (Ctrl+Z)"><i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>Undo</button>
                        </div>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <button type="button" id="copyBtn" class="btn btn-sm btn-primary fw-bold"><i class="bi bi-clipboard me-1" aria-hidden="true"></i>Copy</button>
                            <button type="button" id="downloadPngBtn" class="btn btn-sm btn-outline-primary"><i class="bi bi-download me-1" aria-hidden="true"></i>PNG</button>
                            <button type="button" id="downloadJpgBtn" class="btn btn-sm btn-outline-primary"><i class="bi bi-download me-1" aria-hidden="true"></i>JPG</button>
                            <button type="button" id="downloadPdfBtn" class="btn btn-sm btn-outline-primary"><i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>PDF</button>
                        </div>
                    </div>

                    <div class="px-3 py-2 border-bottom border-secondary-subtle d-flex justify-content-between gap-2 small">
                        <span id="captureMeta" class="text-secondary text-truncate">Loading capture…</span>
                        <span id="statusMsg" class="text-success fw-bold text-nowrap" role="status" aria-live="polite"></span>
                    </div>

                    <div id="stageScroll" class="card-body bg-body-tertiary custom-scrollbar text-center bg-checker">
                        <div id="stage">
                            <canvas id="editorCanvas" width="0" height="0" aria-label="Screenshot"></canvas>
                            <svg id="draftLayer" aria-hidden="true"></svg>
                        </div>
                        <p id="emptyState" class="text-secondary my-5 d-none">No captures yet. Use Visible Area, Full Page or Region in Marquis to take one.</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-3">
                <div class="card bg-body-tertiary border-secondary-subtle shadow-sm">
                    <div class="card-header mq-section-header">
                        <h2 class="h6 mb-0 fw-bold"><i class="bi bi-clock-history me-2" aria-hidden="true"></i>History</h2>
                        <span class="text-secondary" style="font-size: var(--mq-fs-xs);">Last 20</span>
                    </div>
                    <ul id="historyList" class="list-group list-group-flush custom-scrollbar" style="max-height: calc(100vh - 180px); overflow-y: auto;"></ul>
                    <p id="historyEmpty" class="text-secondary small p-2 mb-0 d-none">Your captures will appear here.</p>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-secondary-subtle shadow-lg rounded-3 overflow-hidden bg-body">
                <div class="modal-body text-center">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-2 mb-2 d-block" aria-hidden="true"></i>
                    <h6 class="fw-bold mb-2">Something went wrong</h6>
                    <p class="small text-muted mb-3" id="errorModalMsg">An error occurred.</p>
                    <button type="button" class="btn btn-outline-secondary w-100 fw-bold rounded-pill shadow-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="scripts/capture_store.js"></script>
    <script src="scripts/preview.js"></script>
</body>
</html>
